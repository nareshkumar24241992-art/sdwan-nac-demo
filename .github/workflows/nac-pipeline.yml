name: SD-WAN Network as Code CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  TF_VAR_sdwan_url: ${{ secrets.SDWAN_URL }}
  TF_VAR_sdwan_username: ${{ secrets.SDWAN_USERNAME }}
  TF_VAR_sdwan_password: ${{ secrets.SDWAN_PASSWORD }}

jobs:
  terraform:
    name: Validate, Plan & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # setup-terraform downloads a zip and needs unzip (often missing on minimal self-hosted runners)
      - name: Install unzip
        run: |
          if command -v unzip >/dev/null 2>&1; then
            echo "unzip already installed"
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y unzip
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y unzip
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y unzip
          else
            echo "Install unzip on this self-hosted runner, then re-run the workflow."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Wrapper is a Node script; self-hosted runners often have no `node` on PATH for shell steps
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (PR & Push)
        run: terraform plan -no-color

      - name: Terraform Apply (Merge to Main Only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
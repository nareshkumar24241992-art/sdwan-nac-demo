name: SD-WAN Network as Code CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  TF_VAR_sdwan_url: ${{ secrets.SDWAN_URL }}
  TF_VAR_sdwan_username: ${{ secrets.SDWAN_USERNAME }}
  TF_VAR_sdwan_password: ${{ secrets.SDWAN_PASSWORD }}
  TF_STATE_SUBDIR: sdwan-nac-demo

jobs:
  terraform:
    name: Validate, Plan & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Terraform state from runner
        run: |
          TF_STATE_DIR="${HOME}/terraform-state/${TF_STATE_SUBDIR}"
          mkdir -p "$TF_STATE_DIR"
          if [ -f "$TF_STATE_DIR/terraform.tfstate" ]; then
            cp "$TF_STATE_DIR/terraform.tfstate" terraform.tfstate
            [ -f "$TF_STATE_DIR/terraform.tfstate.backup" ] && \
              cp "$TF_STATE_DIR/terraform.tfstate.backup" terraform.tfstate.backup || true
          fi

      - name: Install unzip
        run: |
          command -v unzip >/dev/null 2>&1 && exit 0
          command -v apt-get >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y unzip

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          VMANAGE_URL: ${{ secrets.SDWAN_URL }}
          VMANAGE_USER: ${{ secrets.SDWAN_USERNAME }}
          VMANAGE_PASSWORD: ${{ secrets.SDWAN_PASSWORD }}
        run: |
          set -e
          APPLY_RC=0
          terraform apply -auto-approve 2>&1 | tee apply.log || APPLY_RC=$?
          if [ "$APPLY_RC" -eq 0 ]; then
            exit 0
          fi
          if grep -qE 'already exists|FPROF0001|Duplicate profile|Duplicate parcel' apply.log; then
            echo "vManage has stale objects and state is out of sync — resetting lab and retrying..."
            bash scripts/lab-reset-vmanage.sh
            rm -f terraform.tfstate terraform.tfstate.backup
            rm -f "${HOME}/terraform-state/${TF_STATE_SUBDIR}/terraform.tfstate"*
            terraform apply -auto-approve
          else
            cat apply.log
            exit "$APPLY_RC"
          fi

      - name: Save Terraform state on runner
        if: success()
        run: |
          TF_STATE_DIR="${HOME}/terraform-state/${TF_STATE_SUBDIR}"
          mkdir -p "$TF_STATE_DIR"
          [ -f terraform.tfstate ] && cp terraform.tfstate "$TF_STATE_DIR/"
          [ -f terraform.tfstate.backup ] && cp terraform.tfstate.backup "$TF_STATE_DIR/" || true
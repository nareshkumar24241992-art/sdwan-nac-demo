# DevNet 20.18 sandbox already binds Edge1–4 to config group "edge_basic".
# Associating the same chassis to "branches" fails with CFGRP0018.
# Leave routers empty so Terraform only creates the group + profiles.
# To attach a device: unassociate it from edge_basic in vManage first, then add:
#
# sdwan:
#   sites:
#     - id: 1
#       routers:
#         - chassis_id: C8K-....
#           configuration_group: branches
#           configuration_group_deploy: true
#           device_variables:
#             host_name: edge1
#             system_ip: 10.0.0.1
#             site_id: 1
#             pseudo_commit_timer: 300
#             inet_interface_name: GigabitEthernet1
#             mpls_interface_name: GigabitEthernet2
sdwan:
  sites: []

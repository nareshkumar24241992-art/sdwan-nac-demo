# Replace chassis_id with your edge router UUID from vManage → Configuration → Devices.
# Sandbox reservations get different device IDs each time.
sdwan:
  sites:
    - id: 1
      routers:
        - chassis_id: REPLACE-WITH-DEVICE-UUID-FROM-VMANAGE
          configuration_group: branches
          configuration_group_deploy: true
          device_variables:
            host_name: edge1
            system_ip: 10.0.0.1
            site_id: 1
            pseudo_commit_timer: 300
            inet_interface_name: GigabitEthernet1
            mpls_interface_name: GigabitEthernet2